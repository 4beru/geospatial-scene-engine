name: Build and GH-Page Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # the library, the docs and the examples are one pnpm workspace
      - name: Build package
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # the documentation, at the root of the site
      - name: Build docs
        run: pnpm --dir docs build

      # Both examples belong to this repository and live under /examples/.
      - name: Build examples
        run: |
          mkdir -p docs/dist/examples
          for example in react basic; do
            pnpm --dir examples/$example build
            cp -R examples/$example/dist docs/dist/examples/$example
          done

      - name: Check published paths and repository links
        run: |
          node --test scripts/check-pages.test.mjs
          pnpm check:pages

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: docs/dist
